services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: netdropbox
      POSTGRES_USER: netdropbox
      POSTGRES_PASSWORD: netdropbox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netdropbox -d netdropbox"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: netdropbox
      RABBITMQ_DEFAULT_PASS: netdropbox
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: netdropbox
      MINIO_ROOT_PASSWORD: netdropbox-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: src/NetDropbox.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=netdropbox;Username=netdropbox;Password=netdropbox
      Jwt__Issuer: NetDropbox
      Jwt__Audience: NetDropboxClient
      Jwt__SigningKey: local-development-signing-key-change-me-32chars
      Storage__Provider: Local
      Storage__LocalRoot: /app/storage
      Storage__S3__ServiceUrl: http://minio:9000
      Storage__S3__AccessKey: netdropbox
      Storage__S3__SecretKey: netdropbox-secret
      Storage__S3__Bucket: netdropbox
      Chunks__Root: /app/chunks
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "5080:8080"
    volumes:
      - api-storage:/app/storage
      - api-chunks:/app/chunks

volumes:
  postgres-data:
  minio-data:
  api-storage:
  api-chunks:

